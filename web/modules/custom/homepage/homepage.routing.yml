homepage.content:
  path: '/homepage'
  defaults:
    _controller: '\Drupal\homepage\Controller\HomepageController::content'
    _title: ''
  requirements:
    _permission: 'access content'

homepage.team:
  path: '/wondem-team'
  defaults:
    _controller: '\Drupal\homepage\Controller\HomepageTeamController::content'
    _title: 'Wondem Team'
  requirements:
    _permission: 'access content'
